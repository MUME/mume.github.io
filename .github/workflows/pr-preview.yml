name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine Base URL Prefix
        id: base_url
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          OWNER_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "$REPO_NAME" = "mume.github.io" ] || [ "$REPO_NAME" = "${OWNER_NAME}.github.io" ]; then
            echo "prefix=/" >> $GITHUB_OUTPUT
          else
            echo "prefix=/${{ github.event.repository.name }}/" >> $GITHUB_OUTPUT
          fi
          echo "host=${{ github.repository_owner }}.github.io" >> $GITHUB_OUTPUT

      - name: Setup environment
        run: ./scripts/ci-env.sh
        env:
          PREVIEW_HOST: ${{ steps.base_url.outputs.host }}
          PREVIEW_PREFIX: ${{ steps.base_url.outputs.prefix }}pr-${{ github.event.number }}/

      - name: Build preview
        run: npm run build
        env:
          VITE_BASE: ${{ steps.base_url.outputs.prefix }}pr-${{ github.event.number }}/

      - name: Verify links and asset paths
        run: npm test
        env:
          VITE_BASE: ${{ steps.base_url.outputs.prefix }}pr-${{ github.event.number }}/

      - name: Package build
        run: |
          cd dist
          zip -r ../pr-${{ github.event.number }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-${{ github.event.number }}
          path: pr-${{ github.event.number }}.zip
          retention-days: 30
