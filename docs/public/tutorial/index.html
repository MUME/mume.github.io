<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUME Tutorial</title>
<style>
  :root{
    --bg:#000;
    --chrome:#d6d2c8;
    --chrometext:#1c1c1c;
    --panel:#000;
    --rule:#242424;
    --text:#cfcfcf;
    --dim:#7d7d7d;
    --cyan:#37b6b6;
    --amber:#d8b04a;
    --green:#5fbb72;
    --red:#c25a5a;
    --mono:"DejaVu Sans Mono","Menlo","Consolas","Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--mono); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
  :focus-visible{outline:1px solid var(--cyan); outline-offset:2px}

  #shell{display:flex; height:100vh}
  #shell > *{min-width:0}
  #panel{overflow:hidden; transition:flex-basis 1s cubic-bezier(.45,0,.15,1)}
  #map, #desc{flex:0 0 0%; overflow:hidden; transition:flex-basis 1s cubic-bezier(.45,0,.15,1)}
  #shell.mmapper #panel{flex-basis:0px}
  #shell.mmapper #map{flex-basis:33%}
  #shell.mmapper #desc{flex-basis:19%}
  /* framed like the terminal, and only while revealed so no border sliver shows otherwise */
  #shell.mmapper #map, #shell.mmapper #desc{
    border:1px solid rgba(215,166,63,.7); border-radius:10px;
    box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 16px 50px rgba(0,0,0,.5)}
  /* ---------- MMapper preview panels ---------- */
  #map, #desc{position:relative; background:#000}
  .mmimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; display:block; padding:6px}
  .mmbar{background:var(--chrome); color:var(--chrometext); font-size:13px; padding:3px 8px;
       white-space:nowrap; overflow:hidden}
  #mapbody{flex:1 1 auto; position:relative; background:
       repeating-linear-gradient(0deg, rgba(60,70,52,.5) 0 1px, transparent 1px 44px),
       repeating-linear-gradient(90deg, rgba(60,70,52,.5) 0 1px, transparent 1px 44px),
       radial-gradient(130% 120% at 42% 34%, #48543b 0%, #2d3726 58%, #212a1d 100%)}
  #mapnote{position:absolute; left:0; right:0; bottom:14px; text-align:center; color:#d7d2c8; font-size:12px; opacity:.75}
  #descbody{flex:1 1 auto; overflow-y:auto; display:flex; flex-direction:column}
  .desctext{font-size:13px; color:#e6e6e6; line-height:1.5; padding:8px 10px}
  .descloc{color:#5fbb72; display:block; margin-bottom:2px}
  .descpic{flex:1 1 auto; min-height:200px; background:
       linear-gradient(180deg,#d9c081 0%,#c1a75f 16%,#8a8a4f 40%,#5a6640 64%,#333d25 100%)}

  /* ---------- terminal ---------- */
  #term{flex:1 1 auto; display:flex; flex-direction:column; min-width:0}
  #screen{flex:1 1 auto; overflow-y:auto; padding:26px 32px 0; scroll-behavior:smooth}
  @media (prefers-reduced-motion: reduce){ #screen{scroll-behavior:auto} }
  #log{max-width:76ch}
  #foot{max-width:76ch; padding:0 32px 0}

  .banner{color:var(--dim); white-space:pre; font-size:12px; line-height:1.2; margin-bottom:14px}
  .banner b{color:var(--text); font-weight:normal}

  .blk{padding-bottom:8px}
  .eyebrow{color:var(--dim); font-size:13px; margin-bottom:6px}
  h2{font-size:16px; font-weight:normal; margin:0 0 16px; color:var(--amber)}
  h2::before{content:"*** "; color:var(--dim)}
  h2::after{content:" ***"; color:var(--dim)}
  .line{margin:0 0 12px}
  .teach{margin:18px 0 6px; border-left:1px solid var(--rule); padding-left:16px}
  .teach dl{display:grid; grid-template-columns:max-content 1fr; gap:2px 18px; margin:0}
  .teach dt{color:var(--amber)}
  .teach dd{margin:0}
  .ask{margin:20px 0 0; color:var(--cyan)}
  .exlead{margin:18px 0 6px; color:var(--dim)}
  .example{white-space:pre; overflow-x:auto; font-size:13px; color:var(--text);
       border-left:2px solid var(--rule); padding:10px 0 10px 16px; margin:0 0 6px}
  .cmd{color:var(--amber)}
  .echo{margin:14px 0 0; color:var(--green)}
  .err{margin:6px 0 0; color:var(--red)}
  .ok{margin:6px 0 0; color:var(--green)}
  .rule{border:0; border-top:1px solid var(--rule); margin:22px 0}
  .sheetdump{margin:10px 0 0}
  .sheetdump dl{display:grid; grid-template-columns:max-content 1fr; gap:2px 18px; margin:0}
  .sheetdump dt{color:var(--amber)}
  .sheetdump dd{margin:0}

  /* ---------- prompt ---------- */
  #status{
    display:flex; gap:20px; align-items:center; flex-wrap:wrap;
    color:var(--dim); font-size:13px; padding:14px 0 10px;
  }
  #status button{color:var(--dim); border-bottom:1px dotted var(--rule)}
  #status button:hover{color:var(--cyan)}
  .track{display:flex; gap:3px; align-items:center}
  .tick{width:9px; height:3px; background:var(--rule)}
  .tick.done{background:var(--cyan)}
  .tick.now{background:var(--amber)}
  #promptbar{border-top:1px solid var(--rule); padding:12px 0 18px; display:flex; align-items:baseline; gap:10px}
  #caret{color:var(--green)}
  #entry{flex:1 1 auto; background:none; border:none; color:var(--text); font:inherit; padding:0}
  #entry:focus{outline:none}

  /* ---------- panel, framed like MMapper's description panel ---------- */
  #panel{flex:0 0 320px; display:flex; flex-direction:column; border-left:1px solid var(--rule); background:var(--panel)}
  #panelbar{
    background:var(--chrome); color:var(--chrometext); font-size:13px;
    padding:3px 8px; display:flex; justify-content:space-between; align-items:center;
  }
  #panelbar button{color:var(--chrometext); font-size:13px; line-height:1}
  #sheet{flex:1 1 auto; width:100%; border:0; background:#000}

  /* ---------- cms ---------- */
  #cms{
    position:fixed; inset:0 0 0 auto; width:min(560px,100%);
    background:#0b0b0b; border-left:1px solid var(--rule);
    display:none; flex-direction:column; z-index:20;
  }
  #cms.open{display:flex}
  #cms header{display:flex; justify-content:space-between; align-items:center; padding:16px 22px; border-bottom:1px solid var(--rule)}
  #cms header span{color:var(--dim); font-size:13px}
  #cms .body{flex:1 1 auto; overflow-y:auto; padding:18px 22px}
  #cms .toolbar{display:flex; gap:16px; padding:14px 22px; border-top:1px solid var(--rule); font-size:13px; flex-wrap:wrap}
  #cms .toolbar button{color:var(--cyan)}
  .row{border:1px solid var(--rule); padding:12px 14px; margin-bottom:10px}
  .row.sel{border-color:var(--cyan)}
  .row .top{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
  .row .top strong{font-weight:normal}
  .row .sec{color:var(--dim); font-size:12px}
  .row .ctrl{display:flex; gap:12px; font-size:12px}
  .row .ctrl button{color:var(--dim)}
  .row .ctrl button:hover{color:var(--cyan)}
  label{display:block; color:var(--dim); font-size:12px; margin:14px 0 4px}
  input[type=text], textarea{
    width:100%; background:#000; border:1px solid var(--rule); color:var(--text);
    font:inherit; font-size:14px; padding:7px 9px;
  }
  textarea{resize:vertical}
  input[type=text]:focus, textarea:focus{outline:none; border-color:var(--cyan)}
  .hintline{color:var(--dim); font-size:12px; margin-top:4px}

  @media (max-width:900px){
    #panel, #map, #desc{display:none}
    #screen{padding:20px 18px 0}
    #foot{padding:0 18px}
  }

  /* ===================== cinematic layer (preview only) ===================== */
  @font-face{font-family:'Kelt';src:url('fonts/kelt.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Kelt';src:url('fonts/kelt-bold.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Merriweather';src:url('fonts/Merriweather-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:'Merriweather';src:url('fonts/Merriweather-Italic.woff2') format('woff2');font-style:italic;font-display:swap}
  :root{--gold:#d7a63f; --goldhi:#f4dd94; --kelt:'Kelt',Georgia,serif; --serif:'Merriweather',Georgia,serif}
  body{background:#000}

  #shell{padding:22px; gap:18px}
  #term{position:relative; border:1px solid rgba(215,166,63,.7); border-radius:10px; overflow:hidden;
    box-shadow:inset 0 0 60px rgba(0,0,0,.6), 0 16px 50px rgba(0,0,0,.5);
    background:radial-gradient(120% 80% at 50% 0%, rgba(70,54,24,.16), transparent 55%), #070707}
  #term::after{content:""; position:absolute; inset:7px; border:1px solid rgba(215,166,63,.18); border-radius:6px; pointer-events:none; z-index:5}
  .corner{position:absolute; width:32px; height:32px; stroke:var(--gold); fill:none; stroke-width:1.5; opacity:.9; z-index:6}
  .corner.tl{top:6px;left:6px}.corner.tr{top:6px;right:6px;transform:scaleX(-1)}
  .corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}.corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}
  #screen{-webkit-mask:linear-gradient(180deg, transparent 0, #000 28px, #000 100%); mask:linear-gradient(180deg, transparent 0, #000 28px, #000 100%)}
  .eyebrow{color:var(--gold); font-family:var(--serif); font-style:italic; font-size:14px}
  h2{font-family:var(--serif); font-weight:700; color:var(--goldhi)}
  h2::before, h2::after{content:none !important}

  #title{position:fixed; inset:0; z-index:100; background:#000; display:flex; align-items:center; justify-content:center; overflow:hidden; transition:opacity 1.3s ease}
  #title.gone{opacity:0; pointer-events:none}
  .logowrap{position:relative; width:min(82vw,1100px); animation:kb 9s ease-in-out 2.4s infinite alternate}
  .logo{display:block; width:100%; height:auto; opacity:0; clip-path:inset(50% 0 50% 0); animation:lrev 1.25s cubic-bezier(.22,1,.3,1) .5s forwards}
  .stripe{position:absolute; left:8%; right:8%; top:50%; height:2px; transform:translateY(-50%); background:linear-gradient(90deg,transparent,rgba(255,236,190,.95) 25%,rgba(255,236,190,.95) 75%,transparent); box-shadow:0 0 18px rgba(255,220,150,.8); opacity:0; animation:strp 1.5s ease .2s}
  .sheen{position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen; opacity:0;
    background:linear-gradient(105deg,transparent 42%,rgba(255,243,208,.6) 50%,transparent 58%);
    background-size:260% 100%; background-position:210% 0;
    -webkit-mask:url('assets/mume_logo.jpg') center/contain no-repeat; -webkit-mask-mode:luminance;
    mask:url('assets/mume_logo.jpg') center/contain no-repeat; mask-mode:luminance;
    animation:shn 3s ease 1.7s}
  @keyframes lrev{0%{opacity:1;clip-path:inset(50% 0 50% 0)}100%{opacity:1;clip-path:inset(0 0 0 0)}}
  @keyframes strp{0%{opacity:0;transform:translateY(-50%) scaleX(.12)}18%{opacity:1}42%{opacity:1}100%{opacity:0;transform:translateY(-50%) scaleX(1)}}
  @keyframes kb{from{transform:scale(1)}to{transform:scale(1.04)}}
  @keyframes shn{0%{opacity:0;background-position:210% 0}14%{opacity:1}100%{opacity:0;background-position:-70% 0}}
  .ember{position:absolute; bottom:-12px; border-radius:50%; background:radial-gradient(circle,#ffd98a,#d7a63f 60%,transparent 70%); opacity:0; animation:rise linear infinite}
  @keyframes rise{0%{opacity:0;transform:translateY(0) translateX(0)}10%{opacity:.85}100%{opacity:0;transform:translateY(-96vh) translateX(var(--dx))}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important}}
</style>
<style>[data-act="cms"],#cms{display:none!important}</style>
</head>
<body>

<div id="title" aria-hidden="true">
  <div class="logowrap">
    <img class="logo" src="assets/mume_logo.jpg" alt="MUME — Multi-Users in Middle-earth">
    <div class="stripe"></div>
    <div class="sheen"></div>
  </div>
</div>

<div id="shell">
  <main id="term">
    <svg class="corner tl" viewBox="0 0 32 32"><path d="M2 30V10C2 5 5 2 10 2H30"/><path d="M2 22V13C2 9 9 2 13 2H22"/></svg>
    <svg class="corner tr" viewBox="0 0 32 32"><path d="M2 30V10C2 5 5 2 10 2H30"/><path d="M2 22V13C2 9 9 2 13 2H22"/></svg>
    <svg class="corner bl" viewBox="0 0 32 32"><path d="M2 30V10C2 5 5 2 10 2H30"/><path d="M2 22V13C2 9 9 2 13 2H22"/></svg>
    <svg class="corner br" viewBox="0 0 32 32"><path d="M2 30V10C2 5 5 2 10 2H30"/><path d="M2 22V13C2 9 9 2 13 2H22"/></svg>
    <div id="screen"><div id="log"></div></div>
    <div id="foot">
      <div id="status"></div>
      <div id="promptbar">
        <span id="caret">&gt;</span>
        <input id="entry" autocomplete="off" spellcheck="false" aria-label="Type a command">
      </div>
    </div>
  </main>
  <aside id="panel">
    <div id="panelbar"><span>Command Sheet</span><button id="panelPrint">print</button></div>
    <iframe id="sheet" src="about:blank" title="Command sheet"></iframe>
  </aside>
  <section id="map"><img class="mmimg" src="assets/map.png" alt="Live map of Middle-earth"></section>
  <section id="desc"><img class="mmimg" src="assets/desc.png" alt="Room description and view"></section>
</div>

<section id="cms" aria-label="Tutorial editor">
  <header><span>Tutorial editor</span><button id="cmsClose">close</button></header>
  <div class="body" id="cmsBody"></div>
  <div class="toolbar">
    <button id="cmsAdd">add lesson</button>
    <button id="cmsShare">share my version</button>
    <button id="cmsPublish">publish to everyone</button>
    <select id="cmsVersions" title="restore an earlier published version"><option value="">restore a version…</option></select>
    <button id="cmsExport">export json</button>
    <button id="cmsImport">import json</button>
    <button id="cmsReset">reset to default</button>
    <input type="file" id="cmsFile" accept="application/json" hidden>
    <span id="cmsState" class="hintline"></span>
  </div>
</section>

<script>
/* =========================================================
   CONTENT
   Every lesson is data. The same JSON can drive an in-game
   version, so nothing here is hard-coded into the layout.
   ========================================================= */
const DEFAULT = {
  "version": 3,
  "lessons": [
    {
      "section": "Before you start",
      "title": "What is a MUD?",
      "body": [
        "MUME is a MUD: a Multi-User Dungeon. It is a game world made of text, played by hundreds of people at the same time.",
        "There are no graphics. The game describes a room, and you type what you want to do. That is the whole loop.",
        "Nothing is on a timer while you read. Take as long as you like."
      ],
      "teach": [],
      "practice": null
    },
    {
      "section": "Before you start",
      "title": "What is MUME?",
      "body": [
        "MUME is Middle-earth. The map is built from Tolkien, from the Shire to Bree to the Misty Mountains, and it has been growing since 1991.",
        "You pick a side. The Free Peoples defend the West. The forces of Mordor attack it.",
        "As a new player, you'll start on the side of men, hobbits, dwarves and elves. You will being your journey near the Tower Hills as a new character with only the most basic of equipment. That is normal. Everyone starts there."
      ],
      "teach": [],
      "practice": null
    },
    {
      "section": "Talking to the game",
      "title": "How to type",
      "body": [
        "You talk to MUME in short instructions. Usually a verb, then a thing.",
        "look sign",
        "get sword",
        "The game only understands the words it knows. If it does not understand you, it says so, and nothing bad happens. Guessing is free.",
        "Try it now. Type the word below and press Enter."
      ],
      "teach": [
        {
          "c": "look",
          "d": "describe the room you are in"
        }
      ],
      "practice": {
        "ask": "look",
        "accept": [
          "look",
          "l"
        ],
        "hint": "Type: look"
      },
      "example": "> look\nEast of the Bridge\nYou are standing on the Old East Road, just east of the Brandywine bridge.\nA dusty road leads to a gate in a tall hedgerow to the south - the High Hay.\nIt was grown to protect Buckland from the old forest many years ago, and is\nthick and nearly impenetrable.\nExits: north, south, east, west."
    },
    {
      "section": "The basics",
      "title": "Moving around",
      "body": [
        "You move by compass direction, not left and right. North, south, east, west, up, down.",
        "You can type the whole word or just the first letter.",
        "Every room lists its exits. If a direction is not listed, you cannot go that way.",
        "Doors sometimes need opening first: open north."
      ],
      "teach": [
        {
          "c": "north / n",
          "d": "move north (also s, e, w, u, d)"
        },
        {
          "c": "exits",
          "d": "list the ways out of this room"
        },
        {
          "c": "open north",
          "d": "open a closed door"
        }
      ],
      "practice": {
        "ask": "exits",
        "accept": [
          "exits",
          "ex"
        ],
        "hint": "Type: exits"
      },
      "example": "> exits\nExits:\n  North   - Prancing Pony Inn\n -East-   - Cobble Street\n -South-  - Old East Road\n -West-   - Old East Road"
    },
    {
      "section": "The basics",
      "title": "Looking at things",
      "body": [
        "look on its own describes the room again. Useful when text has scrolled past you.",
        "examine a specific thing to study it closely. Most objects, people and signs have their own description, and examine shows you the detail.",
        "It works on anything you can see: examine sword, examine elf, examine sign."
      ],
      "teach": [
        {
          "c": "look",
          "d": "describe the room again"
        },
        {
          "c": "examine sword",
          "d": "study one thing closely (also: exa)"
        }
      ],
      "practice": {
        "ask": "examine elf",
        "accept": [
          "examine elf",
          "exa elf",
          "examine",
          "exa"
        ],
        "hint": "Type: examine elf"
      },
      "example": "> examine elf\nFair and graceful this child of Eru is, and with but a cursory glance in your\ndirection he continues to walk, dreaming of mysterious things.\nAn elf is in an excellent condition.\nAn elf is using:\n<worn on head>       a green hood (flawless)\n<worn on body>       a grey shirt (well-maintained)\n<worn on arms>       a white pair of sleeves (satisfactory)\n<worn on legs>       a grey pair of pants (flawless)\n<worn on feet>       a pair of soft leather boots (neglected)\n\n> examine sword\nThis narrow, single-edged blade has been inlaid with gold filigree from point\nto pommel. The grip is black leather, embossed with the image of a red hill\nagainst a setting sun. An intricately fashioned guard of silver cages the\nhandle."
    },
    {
      "section": "The basics",
      "title": "Carrying and wearing",
      "body": [
        "Picking something up is not the same as using it. You get it, then you wear it or wield it.",
        "Two lists matter. inventory is what you are carrying. equipment is what you have on you and in your hands.",
        "Word order counts when you give things away: give sword to guard."
      ],
      "teach": [
        {
          "c": "inventory / i",
          "d": "what you are carrying"
        },
        {
          "c": "equipment / eq",
          "d": "what you are wearing and holding"
        },
        {
          "c": "get sword",
          "d": "pick something up"
        },
        {
          "c": "wear cloak",
          "d": "put on armour or clothing"
        },
        {
          "c": "wield sword",
          "d": "hold a weapon ready"
        },
        {
          "c": "remove cloak",
          "d": "take something off"
        }
      ],
      "practice": {
        "ask": "inventory",
        "accept": [
          "inventory",
          "inv",
          "i"
        ],
        "hint": "Type: inventory"
      },
      "example": "You are carrying:\na sturdy rope\na water skin\na coach ticket\na lantern\na dark coloured flask\na ticket for a trained horse"
    },
    {
      "section": "The basics",
      "title": "Food, water and light",
      "body": [
        "Your character gets hungry and thirsty, and will tell you when. Ignore it long enough and you weaken.",
        "Buy food in towns and drink at fountains, wells and rivers. Carry a water skin so you can drink anywhere.",
        "Away from towns it gets dark, and in the dark you cannot see the room or the exits. Carry a torch or wear a lantern before you leave."
      ],
      "teach": [
        {
          "c": "eat bread",
          "d": "eat something you are carrying"
        },
        {
          "c": "drink water",
          "d": "drink from a fountain, well or river"
        },
        {
          "c": "fill skin",
          "d": "refill your water skin"
        },
        {
          "c": "light torch",
          "d": "make light so you can see"
        }
      ],
      "practice": {
        "ask": "drink water",
        "accept": [
          "drink water",
          "drink"
        ],
        "hint": "Type: drink water"
      },
      "example": "> drink water\nYou drink the water."
    },
    {
      "section": "The basics",
      "title": "Talking to people",
      "body": [
        "There are real people in this world, and they will help you. Rangers exist specifically to help new players.",
        "say talks to everyone in the room. tell talks to one person anywhere in the world.",
        "Characters run by the game respond to simple things. If one asks you a question, nod or say yes.",
        "If you are stuck, this is the fastest fix in the game. Find a ranger and ask."
      ],
      "teach": [
        {
          "c": "who",
          "d": "see who is playing right now"
        },
        {
          "c": "who ranger",
          "d": "find a ranger who can help you"
        },
        {
          "c": "say hello",
          "d": "speak to the room"
        },
        {
          "c": "tell relim hello",
          "d": "speak to one person by name"
        },
        {
          "c": "nod",
          "d": "answer yes to a character talking to you"
        }
      ],
      "practice": {
        "ask": "who ranger",
        "accept": [
          "who ranger",
          "who rangers"
        ],
        "hint": "Type: who ranger"
      },
      "example": "> who ranger\nRangers\n-------\n      Martyrson N'Ekasrof"
    },
    {
      "section": "Staying alive",
      "title": "Fighting, and running",
      "body": [
        "Combat is fast and it is not turn based. You attack, then the fight continues on its own until someone stops it.",
        "Check what you are up against before you swing. Most things that kill new characters were avoidable.",
        "You are allowed to run. flee gets you out through a random exit, and it is often the right move.",
        "score shows your health and how tired you are. Watch it during a fight."
      ],
      "teach": [
        {
          "c": "score",
          "d": "your health, movement and condition"

async function boot(){
  const vid = new URLSearchParams(location.search).get("v");
  try{
    const r = await fetch(vid ? ("api/content?v=" + encodeURIComponent(vid)) : "api/content", {cache:"no-store"});
    if(r.ok){
      const d = await r.json();
      if(d && d.lessons && d.lessons.length){ content = d; source = vid ? "shared" : "published"; }
    }else if(vid){
      alert("That shared tutorial link wasn't found — it may have expired. Showing the standard tutorial.");
      const l = localCopy(); if(l && l.lessons){ content = l; source = "local draft"; }
    }else{
      const l = localCopy(); if(l && l.lessons){ content = l; source = "local draft"; }
    }
  }catch(e){
    const l = localCopy(); if(l && l.lessons){ content = l; source = "local draft"; }
  }
  restart();
  booted = true;
}

async function publish(){
  let t = "";
  try{ t = localStorage.getItem(TOKEN_KEY) || ""; }catch(e){}
  if(!t){ t = prompt("Edit token") || ""; if(!t) return "cancelled"; }
  try{
    const r = await fetch("api/content", {
      method:"PUT",
      headers:{"content-type":"application/json","x-edit-token":t},
      body:JSON.stringify(content)
    });
    if(r.status === 401) return "token rejected";
    if(!r.ok) return "publish failed";
    try{ localStorage.setItem(TOKEN_KEY, t); }catch(e){}
    source = "published";
    return "published";
  }catch(e){ return "no connection"; }
}

/* =========================================================
   LOG
   Everything appends. Nothing is ever replaced, so the
   player can always scroll back over what they were told.
   ========================================================= */
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// The scroll offset that would bring an element's top to the top of the visible
// screen. Measured by rect so it is independent of which ancestor is the
// offsetParent (the fantasy frame makes #term positioned).
function topOf(el){
  return $screen.scrollTop + (el.getBoundingClientRect().top - $screen.getBoundingClientRect().top);
}

// A controllable, eased scroll. Timer-driven (not rAF) so it still runs when the
// tab is backgrounded, and forced to scroll-behavior:auto so it never fights the
// CSS smooth-scroll. Clamps to the reachable range.
function tweenScroll(to, ms){
  const max = $screen.scrollHeight - $screen.clientHeight;
  to = Math.max(0, Math.min(to, max));
  const start = $screen.scrollTop, delta = to - start;
  clearInterval($screen.__tw);
  if(reduceMotion || Math.abs(delta) < 2 || ms <= 0){ $screen.scrollTop = to; return; }
  $screen.style.scrollBehavior = "auto";
  const t0 = performance.now(), ease = x => 1 - Math.pow(1 - x, 3);
  $screen.__tw = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    $screen.scrollTop = start + delta * ease(p);
    if(p >= 1) clearInterval($screen.__tw);
  }, 16);
}

// Bring a freshly-appended block's top just under the border. A short delay lets
// layout and font metrics settle before measuring, so tall lessons align to their
// own heading instead of landing mid-text.
function alignTop(el, ms){
  if(!el) return;
  setTimeout(() => tweenScroll(topOf(el) - 14, ms == null ? 600 : ms), 30);
}

function append(html, scrollToTop){
  const el = document.createElement("div");
  el.innerHTML = html;
  const first = el.firstElementChild;
  while(el.firstChild) $log.appendChild(el.firstChild);
  if(scrollToTop && first) alignTop(first);
  else $screen.scrollTop = $screen.scrollHeight;
  return first;
}

function showLesson(){
  const L = content.lessons[idx];
  if(!L){ showEnd(); return; }

  // lesson uses the normal layout so the Command Sheet returns afterwards. Toggle
  // before the text renders so the panels and the lesson load together.
  const isMap = L.section === "Playing the game";
  document.getElementById("shell").classList.toggle("mmapper", isMap);
  // The very first reveal stays at the top so the intro can slow-scroll down into
  // it (see introScroll); every later lesson aligns its own heading under the border.
  const first = append(lessonHtml(L), !firstReveal);
  learn(L);
  paintStatus();
  paintSheet();
  if(isMap && first){
    // The panels slide in over ~1s, reflowing the now-narrower text taller. Re-align
    // to the lesson's top once that settles so its bottom is no longer pushed off.
    setTimeout(() => tweenScroll(topOf(first) - 14, 480), 1080);
  }
}

$entry.addEventListener("keydown", e => {
  if(e.key !== "Enter") return;
  const raw = $entry.value.trim();
  const cmd = raw.toLowerCase();
  $entry.value = "";
  if(raw) append(`<p class="echo">&gt; ${esc(raw)}</p>`);

  if(cmd === "commands"){ dumpSheet(); return; }
  if(cmd === "skip"){ skip(); return; }
  if(cmd === "tutorial"){ restart(); return; }

  if(finished){ handover(); return; }

  // After a command's example response, any Enter carries on to the next lesson.
  if(awaitingExample){ awaitingExample = false; idx++; showLesson(); return; }

  const L = content.lessons[idx];
  const p = L && L.practice;

  if(!p){ idx++; showLesson(); return; }
  if(!cmd){ append(`<p class="err">${esc(p.hint || ("Type: " + p.ask))}</p>`); return; }

  const ok = (p.accept || [p.ask]).some(a => a.toLowerCase() === cmd);
  if(ok){
    if(L.example){
      // Show the game's response to what they just typed. Drop the example's own
      // "> command" first line — the player's typed command is already echoed above.
      const body = L.example.replace(/^>[^\n]*\n?/, "");
      append(`<p class="exlead">Here's an example of what you'll see:</p><pre class="example">${esc(body)}</pre><p class="ask">Press Enter to carry on.</p>`);
      awaitingExample = true;
    }else{
      idx++;
      setTimeout(showLesson, 320);
    }
  }else{
    append(`<p class="err">MUME does not know that one here. ${esc(p.hint || ("Try: " + p.ask))}</p>`);
  }
});

function skip(){
  content.lessons.forEach(learn);
  idx = content.lessons.length;
  showEnd();
}
function restart(){
  idx = 0; learned = []; finished = false; awaitingExample = false; mmapperShown = false;
  document.getElementById("shell").classList.remove("mmapper");
  $log.innerHTML = BANNER;
  firstReveal = true;
  showLesson();
  firstReveal = false;
  // Start at the very top so the login header / banner is the first thing seen, then
  // the intro (or, on a manual restart, the settle) eases down into the lesson.
  const toTop = () => { $screen.scrollTop = 0; };
  toTop();
  requestAnimationFrame(toTop);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(toTop);
  // On a manual replay (not the initial boot) there is no cold-open to drive it,
  // so ease down into the lesson here instead.
  if(booted) requestAnimationFrame(introScroll);
}

// Called once the cold-open lifts: begin at the top (banner in view) and slow-scroll
// down into the opening lesson so the header is seen rather than skipped.
function introScroll(){
  $screen.scrollTop = 0;
  const ask = $log.querySelector(".ask");
  const target = ask ? topOf(ask) - ($screen.clientHeight - ask.offsetHeight - 40)
                     : $screen.scrollHeight - $screen.clientHeight;
  setTimeout(() => tweenScroll(target, 2600), 500);
}

document.addEventListener("click", e => {

  if(b){
    const a = b.dataset.act;
    if(a === "skip") skip();
    if(a === "restart") restart();
    if(a === "cms") openCms();
    return;
  }
  if(!document.getElementById("cms").classList.contains("open")) $entry.focus();
});

      o.value = ts;
      let label = ts;
      try{ label = new Date(ts).toLocaleString(); }catch(e){}

      selEl.appendChild(o);
    });
  }catch(e){}

$cmsBody.addEventListener("click", e => {
  const mv = e.target.closest("[data-move]");
  const del = e.target.closest("[data-del]");
  if(mv){
    const i = +mv.dataset.move, j = i + (+mv.dataset.dir);
    if(j<0 || j>=content.lessons.length) return;
    const a = content.lessons; [a[i],a[j]] = [a[j],a[i]];
    sel = j; save(); renderCms(); return;
  }
  if(del){
    content.lessons.splice(+del.dataset.del, 1);
    sel = Math.max(0, Math.min(sel, content.lessons.length-1));
    save(); renderCms(); return;
  }
  // Clicks on the editing fields must pass through untouched — re-rendering here
  // would rebuild the panel and steal focus mid-edit.
  if(e.target.closest("input, textarea, select, button, label")) return;
  const row = e.target.closest("[data-row]");
  if(row){ const n = +row.dataset.row; if(n !== sel){ sel = n; renderCms(); } }
});

$cmsBody.addEventListener("input", e => {
  const f = e.target.dataset.f;
  if(!f) return;
  const L = content.lessons[sel];
  const v = e.target.value;
  if(f === "section") L.section = v;
  if(f === "title") L.title = v;
  if(f === "body") L.body = v.split("\n").filter(x => x.trim() !== "");
  if(f === "teach") L.teach = v.split("\n").filter(x => x.trim() !== "").map(line => {
    const [c,d] = line.split("|");
    return {c:(c||"").trim(), d:(d||"").trim()};
  });
  if(f === "ask"){
    const t = v.trim();
    L.practice = t === "" ? null : {ask:t, accept:[t.toLowerCase()], hint:"Type: " + t};
    const acc = $cmsBody.querySelector('[data-f="accept"]');
    if(acc) acc.value = t.toLowerCase();
  }
  if(f === "accept" && L.practice){
    L.practice.accept = v.split(",").map(x => x.trim().toLowerCase()).filter(Boolean);
  }
  if(f === "example"){ if(v.trim() === "") delete L.example; else L.example = v; }
  save();
});

document.getElementById("cmsPublish").addEventListener("click", async () => {
  const el = document.getElementById("cmsState");
  el.textContent = "publishing";
  el.textContent = await publish();
});
document.getElementById("cmsShare").addEventListener("click", async () => {
  const el = document.getElementById("cmsState");
  el.textContent = "creating your share link…";
  try{
    const r = await fetch("api/share", {
      method:"POST",
      headers:{"content-type":"application/json"},
      body:JSON.stringify(content)
    });
    if(!r.ok){ el.textContent = "share failed"; return; }
    const d = await r.json();
    const link = location.origin + location.pathname + "?v=" + d.id;
    try{ await navigator.clipboard.writeText(link); el.textContent = "link copied to clipboard"; }
    catch(e){ el.textContent = "your share link is ready"; }
    prompt("Your shareable tutorial link (copy it, valid 90 days):", link);
  }catch(e){ el.textContent = "no connection"; }
});
document.getElementById("cmsVersions").addEventListener("change", async e => {
  const ts = e.target.value;
  e.target.value = "";
  if(!ts) return;
  const el = document.getElementById("cmsState");
  el.textContent = "loading that version…";
  try{
    const r = await fetch("api/content?backup=" + encodeURIComponent(ts), {cache:"no-store"});
    if(!r.ok){ el.textContent = "could not load that version"; return; }
    const d = await r.json();
    if(d && d.lessons){
      content = d; sel = 0; save(); renderCms();
      el.textContent = "loaded — click 'publish to everyone' to make it live again";
    }
  }catch(err){ el.textContent = "no connection"; }
});
document.getElementById("cmsClose").addEventListener("click", closeCms);
document.getElementById("cmsAdd").addEventListener("click", () => {
  content.lessons.splice(sel+1, 0, {section:"New section", title:"New lesson", body:["Write the lesson here."], teach:[], practice:null});
  sel++; save(); renderCms();
});
document.getElementById("cmsExport").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(content, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "mume-tutorial-content.json";
  a.click();
});
document.getElementById("cmsImport").addEventListener("click", () => document.getElementById("cmsFile").click());
document.getElementById("cmsFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.lessons) throw 0;
      content = d; sel = 0; save(); renderCms(); restart();
    }catch(err){ alert("That file is not a tutorial export."); }
  };
  r.readAsText(f);
});
document.getElementById("cmsReset").addEventListener("click", () => {
  content = clone(DEFAULT); sel = 0; save(); renderCms(); restart();
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && $cms.classList.contains("open")) closeCms();
});

/* ---------- start ---------- */
boot();
$entry.focus();

/* ---------- cinematic cold-open (pure overlay: never touches the tutorial flow) ---------- */
(function coldOpen(){
  const title = document.getElementById("title");
  if(!title) return;
  for(let i=0;i<22;i++){
    const e=document.createElement("div"); e.className="ember";
    const s=2+Math.random()*2.6; e.style.width=e.style.height=s+"px";
    e.style.left=Math.random()*100+"%";
    e.style.setProperty("--dx",(Math.random()*90-45)+"px");
    e.style.animationDuration=(5+Math.random()*6)+"s";
    e.style.animationDelay=(Math.random()*6)+"s";
    title.appendChild(e);
  }
  let dismissed=false;
  function dismiss(){
    if(dismissed) return; dismissed=true;
    title.classList.add("gone");
    try{ introScroll(); }catch(e){}
    setTimeout(()=>{ title.remove(); $entry.focus(); }, 1300);
  }
  const auto=setTimeout(dismiss, 5200);           // auto-leads into the tutorial
  title.addEventListener("click", ()=>{ clearTimeout(auto); dismiss(); });
  document.addEventListener("keydown", e=>{        // any key skips the intro, without leaking into the tutorial
    if(!dismissed && (e.key==="Enter"||e.key===" "||e.key==="Escape")){
      e.stopPropagation(); e.preventDefault(); clearTimeout(auto); dismiss();
    }
  }, true);
})();
</script>
